<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>BorrowBox</title>

<style>
:root{
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#64748b;
  --border:#e2e8f0;
  --primary:#2563eb;
  --primary2:#1d4ed8;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#ea580c;
  --shadow:0 8px 25px rgba(15,23,42,.07);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:#334155;
  --shadow:0 8px 25px rgba(0,0,0,.25);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
  color:white;
  padding:24px 18px 28px;
  border-radius:0 0 28px 28px;
}

.topbar-inner{
  max-width:850px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  background:rgba(255,255,255,.13);
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.brand h1{
  margin:0;
  font-size:25px;
}

.brand p{
  margin:4px 0 0;
  color:#cbd5e1;
  font-size:13px;
}

.theme-btn{
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);
  color:white;
  width:42px;
  height:42px;
  border-radius:12px;
  font-size:19px;
}

.container{
  max-width:850px;
  margin:auto;
  padding:20px 16px 50px;
}

.primary-btn{
  width:100%;
  border:0;
  background:var(--primary);
  color:white;
  padding:16px;
  border-radius:15px;
  font-weight:700;
  font-size:16px;
  box-shadow:0 6px 16px rgba(37,99,235,.2);
}

.primary-btn:hover{
  background:var(--primary2);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:18px 0;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
  box-shadow:var(--shadow);
}

.stat-icon{
  font-size:21px;
}

.stat-number{
  font-size:25px;
  font-weight:800;
  margin-top:7px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:19px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.card-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.card-title h2{
  margin:0;
  font-size:18px;
}

.search{
  width:100%;
  padding:13px 15px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:12px;
  outline:none;
  margin-bottom:13px;
}

.search:focus,
input:focus,
select:focus,
textarea:focus{
  border-color:var(--primary);
}

.item{
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin-top:10px;
}

.item-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.item-name{
  font-size:17px;
  font-weight:750;
}

.person{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.badge-item{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge-money{
  background:#dcfce7;
  color:#15803d;
}

.badge-due{
  background:#ffedd5;
  color:#c2410c;
}

.badge-overdue{
  background:#fee2e2;
  color:#b91c1c;
}

.details{
  margin-top:12px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.detail{
  background:var(--bg);
  padding:9px;
  border-radius:10px;
  font-size:12px;
}

.detail span{
  display:block;
  color:var(--muted);
  margin-bottom:3px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.action{
  flex:1;
  border:0;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
}

.return{
  background:#dcfce7;
  color:#166534;
}

.edit{
  background:#dbeafe;
  color:#1d4ed8;
}

.delete{
  background:#fee2e2;
  color:#b91c1c;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:22px 10px;
  font-size:14px;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:100;
}

.modal{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  color:var(--text);
  border-radius:22px;
  padding:20px;
}

.modal h2{
  margin-top:0;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:13px 0 6px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--bg);
  color:var(--text);
  outline:none;
}

textarea{
  resize:vertical;
  min-height:75px;
}

.type-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.type-btn{
  padding:12px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:11px;
  font-weight:700;
}

.type-btn.active{
  border-color:var(--primary);
  background:#dbeafe;
  color:#1d4ed8;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.modal-actions button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:11px;
  font-weight:700;
}

.cancel{
  background:var(--border);
  color:var(--text);
}

.save{
  background:var(--primary);
  color:white;
}

.history-title{
  margin-top:25px;
}

.footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:15px;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }

  .stat{
    padding:12px 9px;
  }

  .stat-number{
    font-size:20px;
  }

  .details{
    grid-template-columns:1fr 1fr;
  }

  .actions{
    flex-wrap:wrap;
  }

  .action{
    min-width:30%;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="logo">📦</div>
      <div>
        <h1>BorrowBox</h1>
        <p>Remember what you lent.</p>
      </div>
    </div>

    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
</header>

<main class="container">

  <button class="primary-btn" onclick="openModal()">
    ＋ Add Lending
  </button>

  <section class="stats">
    <div class="stat">
      <div class="stat-icon">📦</div>
      <div class="stat-number" id="activeCount">0</div>
      <div class="stat-label">Active</div>
    </div>

    <div class="stat">
      <div class="stat-icon">⏰</div>
      <div class="stat-number" id="dueCount">0</div>
      <div class="stat-label">Due Soon</div>
    </div>

    <div class="stat">
      <div class="stat-icon">✅</div>
      <div class="stat-number" id="returnedCount">0</div>
      <div class="stat-label">Returned</div>
    </div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>📦 Active Lendings</h2>
    </div>

    <input
      class="search"
      id="search"
      placeholder="🔍 Search person, item or note..."
      oninput="render()"
    >

    <div id="activeList"></div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2 class="history-title">📜 History</h2>
    </div>

    <div id="historyList"></div>
  </section>

  <div class="footer">
    BorrowBox • Your lending records stay on this device.
  </div>

</main>


<!-- MODAL -->

<div class="modal-bg" id="modalBg">

  <div class="modal">

    <h2 id="modalTitle">➕ Add Lending</h2>

    <label>What did you lend?</label>

    <div class="type-buttons">
      <button
        class="type-btn active"
        id="itemTypeBtn"
        onclick="setType('item')">
        📦 Item
      </button>

      <button
        class="type-btn"
        id="moneyTypeBtn"
        onclick="setType('money')">
        💰 Money
      </button>
    </div>

    <label>Person name *</label>
    <input id="person" placeholder="e.g. Rahul">

    <label id="thingLabel">Item *</label>
    <input id="thing" placeholder="e.g. Power Bank">

    <label>Given date</label>
    <input id="givenDate" type="date">

    <label>Return / repayment date</label>
    <input id="dueDate" type="date">

    <label>Note</label>
    <textarea id="note" placeholder="Optional note..."></textarea>

    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="save" onclick="saveLending()">Save</button>
    </div>

  </div>

</div>


<script>

let records =
JSON.parse(localStorage.getItem("borrowbox_records")) || [];

let editingId = null;
let currentType = "item";


/* ---------- UTILITIES ---------- */

function today(){
  return new Date().toISOString().split("T")[0];
}

function saveData(){
  localStorage.setItem(
    "borrowbox_records",
    JSON.stringify(records)
  );
}

function escapeHTML(value){
  const div=document.createElement("div");
  div.textContent=value ?? "";
  return div.innerHTML;
}

function formatDate(date){
  if(!date) return "Not set";

  const d=new Date(date+"T00:00:00");

  return d.toLocaleDateString(undefined,{
    day:"numeric",
    month:"short",
    year:"numeric"
  });
}


/* ---------- MODAL ---------- */

function openModal(id=null){

  editingId=id;

  document.getElementById("modalBg").style.display="flex";

  if(id){

    const record=records.find(r=>r.id===id);

    if(!record) return;

    document.getElementById("modalTitle").textContent="✏️ Edit Lending";

    document.getElementById("person").value=record.person;
    document.getElementById("thing").value=record.thing;
    document.getElementById("givenDate").value=record.givenDate;
    document.getElementById("dueDate").value=record.dueDate || "";
    document.getElementById("note").value=record.note || "";

    setType(record.type);

  }else{

    document.getElementById("modalTitle").textContent="➕ Add Lending";

    document.getElementById("person").value="";
    document.getElementById("thing").value="";
    document.getElementById("givenDate").value=today();
    document.getElementById("dueDate").value="";
    document.getElementById("note").value="";

    setType("item");
  }
}

function closeModal(){
  document.getElementById("modalBg").style.display="none";
  editingId=null;
}

function setType(type){

  currentType=type;

  const itemBtn=document.getElementById("itemTypeBtn");
  const moneyBtn=document.getElementById("moneyTypeBtn");
  const label=document.getElementById("thingLabel");
  const input=document.getElementById("thing");

  itemBtn.classList.toggle("active",type==="item");
  moneyBtn.classList.toggle("active",type==="money");

  if(type==="money"){
    label.textContent="Amount *";
    input.placeholder="e.g. ₹500";
  }else{
    label.textContent="Item *";
    input.placeholder="e.g. Power Bank";
  }
}


/* ---------- SAVE ---------- */

function saveLending(){

  const person=document.getElementById("person").value.trim();
  const thing=document.getElementById("thing").value.trim();
  const givenDate=document.getElementById("givenDate").value;
  const dueDate=document.getElementById("dueDate").value;
  const note=document.getElementById("note").value.trim();

  if(!person || !thing){
    alert("Please enter the person name and item/amount.");
    return;
  }

  if(editingId){

    const record=records.find(r=>r.id===editingId);

    if(record){

      record.person=person;
      record.thing=thing;
      record.givenDate=givenDate;
      record.dueDate=dueDate;
      record.note=note;
      record.type=currentType;
    }

  }else{

    records.unshift({

      id:Date.now(),

      person:person,

      thing:thing,

      givenDate:givenDate,

      dueDate:dueDate,

      note:note,

      type:currentType,

      returned:false,

      returnedDate:""

    });
  }

  saveData();
  closeModal();
  render();
}


/* ---------- STATUS ---------- */

function isDueSoon(record){

  if(!record.dueDate) return false;

  const todayDate=new Date();
  const due=new Date(record.dueDate+"T00:00:00");

  const diff=Math.ceil(
    (due-todayDate)/(1000*60*60*24)
  );

  return diff>=0 && diff<=3;
}

function isOverdue(record){

  if(!record.dueDate) return false;

  const todayDate=new Date();
  const due=new Date(record.dueDate+"T00:00:00");

  return due < new Date(
    todayDate.getFullYear(),
    todayDate.getMonth(),
    todayDate.getDate()
  );
}

function statusBadge(record){

  if(isOverdue(record)){
    return `<span class="badge badge-overdue">OVERDUE</span>`;
  }

  if(isDueSoon(record)){
    return `<span class="badge badge-due">DUE SOON</span>`;
  }

  return "";
}


/* ---------- RETURN ---------- */

function markReturned(id){

  const record=records.find(r=>r.id===id);

  if(!record) return;

  record.returned=true;
  record.returnedDate=today();

  saveData();
  render();
}


/* ---------- DELETE ---------- */

function deleteRecord(id){

  const record=records.find(r=>r.id===id);

  if(!record) return;

  const ok=confirm(
    `Delete "${record.thing}" lent to ${record.person}?`
  );

  if(!ok) return;

  records=records.filter(r=>r.id!==id);

  saveData();
  render();
}


/* ---------- RENDER CARD ---------- */

function createCard(record){

  const badgeType=
    record.type==="money"
    ? `<span class="badge badge-money">💰 MONEY</span>`
    : `<span class="badge badge-item">📦 ITEM</span>`;

  const status=statusBadge(record);

  return `

  <div class="item">

    <div class="item-top">

      <div>
        <div class="item-name">
          ${record.type==="money" ? "💰 " : "📦 "}
          ${escapeHTML(record.thing)}
        </div>

        <div class="person">
          👤 ${escapeHTML(record.person)}
        </div>
      </div>

      <div>
        ${badgeType}
        ${status}
      </div>

    </div>

    <div class="details">

      <div class="detail">
        <span>Given</span>
        ${formatDate(record.givenDate)}
      </div>

      <div class="detail">
        <span>Due</span>
        ${formatDate(record.dueDate)}
      </div>

    </div>

    ${
      record.note
      ? `<div class="person" style="margin-top:10px">
          📝 ${escapeHTML(record.note)}
        </div>`
      : ""
    }

    <div class="actions">

      <button
        class="action return"
        onclick="markReturned(${record.id})">
        ✓ ${record.type==="money" ? "Paid" : "Returned"}
      </button>

      <button
        class="action edit"
        onclick="openModal(${record.id})">
        ✏️ Edit
      </button>

      <button
        class="action delete"
        onclick="deleteRecord(${record.id})">
        🗑️ Delete
      </button>

    </div>

  </div>

  `;
}


/* ---------- RENDER ---------- */

function render(){

  const search=
    document.getElementById("search").value
    .toLowerCase()
    .trim();

  const active=records.filter(r=>!r.returned);

  const history=records.filter(r=>r.returned);

  const filteredActive=active.filter(r=>

    r.person.toLowerCase().includes(search) ||

    r.thing.toLowerCase().includes(search) ||

    (r.note || "").toLowerCase().includes(search)

  );

  document.getElementById("activeCount").textContent=
    active.length;

  document.getElementById("dueCount").textContent=
    active.filter(r=>isDueSoon(r)||isOverdue(r)).length;

  document.getElementById("returnedCount").textContent=
    history.length;


  const activeList=document.getElementById("activeList");

  if(filteredActive.length===0){

    activeList.innerHTML=
      `<div class="empty">
        ${search
          ? "🔍 No matching lending found."
          : "📦 No active lendings yet.<br>Add something you lent."}
      </div>`;

  }else{

    activeList.innerHTML=
      filteredActive.map(createCard).join("");
  }


  const historyList=document.getElementById("historyList");

  if(history.length===0){

    historyList.innerHTML=
      `<div class="empty">
        No returned items yet.
      </div>`;

  }else{

    historyList.innerHTML=
      history.map(record=>`

        <div class="item">

          <div class="item-top">

            <div>

              <div class="item-name">
                ${record.type==="money" ? "💰 " : "📦 "}
                ${escapeHTML(record.thing)}
              </div>

              <div class="person">
                👤 ${escapeHTML(record.person)}
              </div>

            </div>

            <span class="badge"
              style="background:#dcfce7;color:#166534">
              ✓ RETURNED
            </span>

          </div>

          <div class="details">

            <div class="detail">
              <span>Given</span>
              ${formatDate(record.givenDate)}
            </div>

            <div class="detail">
              <span>Returned</span>
              ${formatDate(record.returnedDate)}
            </div>

          </div>

        </div>

      `).join("");
  }
}


/* ---------- DARK MODE ---------- */

function toggleTheme(){

  document.body.classList.toggle("dark");

  const dark=document.body.classList.contains("dark");

  localStorage.setItem(
    "borrowbox_dark",
    dark ? "1" : "0"
  );

  document.getElementById("themeBtn").textContent=
    dark ? "☀️" : "🌙";
}

if(localStorage.getItem("borrowbox_dark")==="1"){

  document.body.classList.add("dark");

  document.getElementById("themeBtn").textContent="☀️";
}


/* ---------- START ---------- */

render();

</script>

</body>
</html>
